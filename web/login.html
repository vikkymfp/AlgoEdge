<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="same-origin" />
    <title>Sign in · AlgoEdge</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="auth.css?v=20260930-ui3" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="loginTitle">
        <h1 id="loginTitle" class="visually-hidden">AlgoEdge sign in</h1>
        <div class="login-brand">
          <img src="logo.png" alt="AlgoEdge" class="login-logo" width="1942" height="809" />
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field">
            <label for="identifier">Email or Mobile Number</label>
            <input id="identifier" name="identifier" type="text" inputmode="email" autocomplete="username"
                   autocapitalize="none" spellcheck="false" maxlength="254" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password"
                     maxlength="1024" required />
              <button type="button" id="togglePassword" class="password-toggle" aria-controls="password"
                      aria-pressed="false" aria-label="Show password" title="Show password">
                <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                </svg>
                <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" hidden>
                  <path d="M3 3l18 18M10.6 5.1A10.9 10.9 0 0112 5c6.4 0 10 7 10 7a17.8 17.8 0 01-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a10.6 10.6 0 005.4-1.6M9.9 9.9a3 3 0 004.2 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="captcha">Security code</label>
            <div class="captcha-row">
              <img id="captchaImage" class="captcha-image" alt="Security code image (6 letters and digits)"
                   width="208" height="52" />
              <button type="button" id="refreshCaptcha" class="ghost-button" aria-label="Get a new security code">
                Refresh
              </button>
            </div>
            <input id="captcha" name="captcha" type="text" autocomplete="off" autocapitalize="characters"
                   spellcheck="false" maxlength="6" pattern="[A-Za-z0-9]{6}" required />
          </div>

          <p id="formMessage" class="form-message" role="alert" aria-live="assertive" hidden></p>

          <button type="submit" id="loginButton" class="primary-button">
            <span class="button-label">Sign in</span>
          </button>
        </form>

        <p class="auth-footnote">Paper / research access only. Sign-in never enables live trading.</p>
      </section>
    </main>
    <script src="login.js?v=20260930-ui3"></script>
  </body>
</html>
